defaults:
  - base
  - _self_

model_log_name: smollm360m
model_name_or_path: HuggingFaceTB/SmolLM-360M

model_args:
  model_revision: main
  dtype: bfloat16
  attn_implementation: flash_attention_2

tokenizer:
  model_revision: ${model_args.model_revision}

make_tokenizer_fn:
  force_override_pad_token: true
